<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finish setup • GPA Calculator</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/darkmode.js"></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-panel">
      <div class="topbar">
        <button id="themeToggleBtn" class="btn btn-ghost btn-icon" type="button" aria-label="Toggle theme"></button>
      </div>

      <div class="auth-card">
        <span class="brand-mark">
          <svg viewBox="11 8 48 48" fill="currentColor" aria-hidden="true"><rect x="14" y="38" width="9" height="12" rx="3" opacity=".55"/><rect x="27.5" y="30" width="9" height="20" rx="3" opacity=".8"/><rect x="41" y="25" width="9" height="25" rx="3"/><path d="M45.5 10.5 56 15.5 45.5 20.5 35 15.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M56 15.5v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="56" cy="22.5" r="1.6"/></svg>
        </span>
        <h1>Finish setting up</h1>
        <p class="lead">Pick a username and password to continue to the app.</p>
        <p id="account" class="auth-account"></p>

        <form id="setupForm" class="auth-form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="30" />
            <p class="field-hint">3–30 characters: letters, numbers, dots or underscores.</p>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" />
            <p class="field-hint">At least 8 characters.</p>
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" required maxlength="128" />
          </div>
          <button id="setupBtn" class="btn btn-block" type="submit">Continue</button>
        </form>

        <div id="msg" class="alert" role="alert"></div>

        <div class="auth-divider">wrong account?</div>
        <button id="cancelBtn" class="btn btn-ghost btn-block" type="button">Sign in with a different account</button>
        <p class="auth-hint">Your password is stored only as a secure hash.</p>
      </div>
    </section>
  </main>

  <script src="/setup.js"></script>
</body>
</html>
